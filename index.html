<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Try &amp; Pick">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Try &amp; Pick 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap">
<style>
/* Layout: 데스크톱은 가운데 폰 프레임 + 아래 단계 표시, 폰에서는 앱이 화면을 꽉 채우고 위에 얇은 안내 띠 */
:root{
  --page:#EEF0EA; --app:#FFFFFF; --ink:#131518; --sub:#5B616B; --mute:#9A9FA6; --line:#ECEDEF; --soft:#F5F6F3;
  --lime:#9CC734; --lime-soft:#F2F8E3; --lime-ink:#3F5A0C; --tp:#C6E05A; --red:#F0423A; --pink:#E5447E; --pink-soft:#FDEEF3;
  --font:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--tp);outline-offset:2px}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-block:28px 36px;gap:16px}
.note{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--sub);font-weight:500;max-width:390px;width:100%;justify-content:space-between}
.note b{color:var(--ink);font-weight:800}
.restart{font-size:13px;font-weight:700;border:1px solid #D6D9D2;border-radius:999px;padding:6px 12px;background:#fff;white-space:nowrap}
.phone{width:390px;max-width:100%;height:800px;border-radius:46px;background:#141518;padding:10px;box-shadow:0 30px 80px rgba(30,40,20,.22)}
.app{position:relative;width:100%;height:100%;border-radius:37px;background:var(--app);overflow:hidden;display:flex;flex-direction:column}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:390px}
.steps span{font-size:12px;font-weight:700;color:var(--mute);padding:4px 2px}
.steps span.on{color:var(--ink)}
.steps span.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--lime);margin-right:5px;vertical-align:1px}
.steps i{font-style:normal;color:#C9CCC4;font-size:12px}
@media (max-width:600px){
  body{padding-left:0;padding-right:0}
  .wrap{padding:0;gap:0;height:100%}
  .note{max-width:none;padding:8px max(14px,env(safe-area-inset-left,0px)) 8px max(14px,env(safe-area-inset-right,0px));background:#141518;color:#C9CCC4;font-size:12px}
  .note b{color:#fff}
  .restart{background:transparent;color:#fff;border-color:#3A3D42;padding:4px 10px}
  .phone{width:100%;height:auto;flex:1;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--app)}
  .app{border-radius:0}
  .steps{display:none}
}

/* app chrome */
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0;font-size:15px;font-weight:700}
.sb .ic{display:flex;gap:5px;align-items:center}.sb .ic i{display:block;background:var(--ink);border-radius:2px}
@media (max-width:600px){.sb{display:none}}
.hdr{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--app);border-bottom:1px solid transparent}
.hdr.line{border-bottom-color:var(--line)}
.hdr .t{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:800}
.hdr .ics{display:flex;gap:14px}
.iconbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bar{flex:none;border-top:1px solid var(--line);background:var(--app);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.btn{flex:1;height:50px;border-radius:10px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.dark{background:var(--ink);color:#fff}
.btn.line{border:1px solid #D5D7DA;background:#fff}
.btn.tp{background:var(--ink);color:#fff}
.btn[disabled]{background:#E3E5E8;color:#A3A7AD;cursor:default}
.gift{width:48px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;gap:2px}

/* detail */
.gal{position:relative;height:262px;background:#F4F4F2;display:flex;align-items:center;justify-content:center}
.gal img{height:200px}
.gal .idx{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.42);color:#fff;font-size:12px;font-weight:600;padding:3px 12px;border-radius:12px;letter-spacing:.05em}
.sw{display:flex;align-items:center;gap:6px;padding:12px 16px 0}
.sw .cb{font-size:12px;font-weight:600;border:1px solid #DDD;border-radius:4px;padding:5px 8px;white-space:nowrap}
.sw img{width:34px;height:34px;object-fit:contain;background:#F4F4F2;border-radius:4px}
.pi{padding:12px 16px 0}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.pname{font-size:17px;font-weight:500;margin-top:6px;line-height:1.4}
.strike{font-size:13px;color:var(--mute);text-decoration:line-through;margin-top:8px}
.price{display:flex;align-items:baseline;gap:8px}
.price .dc{color:var(--red);font-size:22px;font-weight:800}
.price b{font-size:23px;font-weight:800}
.cpn{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--lime-ink)}
.tags{display:flex;gap:4px;margin-top:8px}
.tags span{font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px}
.tags .td{color:var(--pink);background:var(--pink-soft)}.tags .bs{color:#666;background:#F1F1F1}
.rate{font-size:13px;font-weight:600;margin-top:8px}.rate span{color:#CCC;margin:0 4px}
.view{font-size:12.5px;color:var(--sub);margin-top:4px}
.tpban{margin:16px 16px 0;display:flex;align-items:center;gap:12px;width:calc(100% - 32px);border-radius:14px;background:var(--lime-soft);border:1.5px solid #D6E9B0;padding:12px 14px;animation:pulse 2.4s ease-in-out 1s 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(156,199,52,.25)}}
@media (prefers-reduced-motion:reduce){.tpban{animation:none}}
.tpban .th{display:flex;flex:none}
.tpban .th img{width:40px;height:40px;border-radius:9px;background:#fff;border:1px solid #E1E8D4;object-fit:contain}
.tpban .th img+img{margin-left:-12px}
.tpban .tx{flex:1;min-width:0}
.tpban .tx b{display:block;font-size:15px;font-weight:800;color:var(--lime-ink)}
.tpban .tx span{font-size:12.5px;font-weight:600;color:#5D7140}
.tpban .go{font-size:20px;font-weight:700;color:#6E9A1E}
.rows{margin-top:18px;border-top:8px solid #F4F5F6}
.row{display:grid;grid-template-columns:64px 1fr 14px;gap:10px;padding:13px 16px;border-bottom:1px solid #F2F3F4;font-size:13.5px;align-items:start}
.row dt{color:var(--sub);font-weight:500}.row dd{margin:0;font-weight:500}.row dd b{font-weight:800}
.row i{font-style:normal;color:#BBB}

/* flow screens */
.pad{padding:20px 18px}
.eyb{font-size:12.5px;font-weight:800;color:var(--lime-ink);display:flex;align-items:center;gap:6px}
.eyb::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--tp)}
.h1{font-size:22px;font-weight:800;letter-spacing:-0.035em;line-height:1.32;margin:8px 0 0;text-wrap:balance}
.lead{font-size:14px;color:var(--sub);margin-top:6px}
.hero{background:var(--lime-soft);padding:22px 18px 20px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid #E4E6E9;border-radius:14px;padding:14px;background:#fff}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #CFD2D6;flex:none}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:15px;font-weight:700}
.opt .ot span{font-size:12.5px;color:var(--sub);font-weight:500}
.opt.on{border-color:var(--lime);background:var(--lime-soft)}
.opt.on .rd{border:7px solid #6EA51E}
.opt.off{color:#AEB2B8;background:#FAFAFA;cursor:default}.opt.off .ot span{color:#B5B9BE}
.kit{display:flex;gap:12px;align-items:center;margin-top:18px;background:var(--soft);border-radius:14px;padding:12px}
.kit img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.kit small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.kit b{font-size:14.5px;font-weight:800}
.fine{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:12.5px;color:var(--sub)}
.fine li::before{content:"· "}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pc{border:1px solid #E8E9EB;border-radius:14px;padding:10px;min-width:0}
.pc .im{height:110px;background:#F4F4F2;border-radius:10px;display:flex;align-items:center;justify-content:center}
.pc .im img{height:96px}
.pc .bn{font-size:11.5px;color:var(--mute);font-weight:600;margin-top:8px}
.pc .nm{font-size:14.5px;font-weight:700}
.pc .pr{font-size:15px;font-weight:800;margin-top:2px}
.pc .rt{font-size:11.5px;color:var(--sub);font-weight:600}
.pc label{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-top:8px}
.pc select{width:100%;margin-top:3px;height:34px;border:1px solid #D9DBDE;border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:0 8px;background:#fff;color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:10px 4px;border-bottom:1px solid #F0F1F2;text-align:center;font-weight:600}
.cmp th{text-align:left;color:var(--mute);font-weight:600;width:64px}
.tip{margin-top:12px;background:var(--lime-soft);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--lime-ink);font-weight:600}
.tip b{font-weight:800;margin-right:6px}
.sel{display:grid;gap:8px;margin-top:12px}
.stores{display:grid;gap:8px;margin-top:10px;padding-left:34px}
.sum{margin-top:18px;border:1px solid #E8E9EB;border-radius:14px;padding:14px;font-size:13.5px}
.sum dt{color:var(--sub);font-weight:500;font-size:12.5px}.sum dd{margin:2px 0 10px;font-weight:700}.sum dd:last-child{margin-bottom:0}
.done{text-align:center;padding-top:28px}
.ok{width:68px;height:68px;border-radius:50%;background:var(--tp);display:flex;align-items:center;justify-content:center;margin:0 auto}
.qrc{margin:20px auto 0;border:1px solid #E8E9EB;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;text-align:left;max-width:330px}
.qrc canvas{width:96px;height:96px;flex:none;image-rendering:pixelated}
.qrc small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.qrc b{display:block;font-size:20px;font-weight:800;letter-spacing:.02em;margin-top:2px}
.qrc p{margin:6px 0 0;font-size:12.5px;color:var(--sub)}
.tl{list-style:none;margin:22px 0 0;padding:0;text-align:left;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding-bottom:14px;position:relative}
.tl li::after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:#E8E9EB}
.tl li:last-child::after{display:none}
.tl i{width:22px;height:22px;border-radius:50%;border:2px solid #D7DADD;background:#fff;position:relative;z-index:1}
.tl li.on i{border-color:var(--lime);background:var(--tp)}
.tl b{font-size:14.5px;font-weight:700}.tl span{font-size:12.5px;color:var(--sub);font-weight:600}
.skip{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--lime-ink);text-decoration:underline;text-underline-offset:3px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pk button{position:relative;border:2px solid #E4E6E9;border-radius:16px;padding:12px;text-align:center}
.pk .im{height:120px;display:flex;align-items:center;justify-content:center;background:#F4F4F2;border-radius:12px}
.pk img{height:104px}
.pk b{display:block;font-size:15px;font-weight:800;margin-top:8px}
.pk span{font-size:12px;color:var(--sub);font-weight:600}
.pk button.on{border-color:var(--lime);background:var(--lime-soft)}
.pk button.on::after{content:"✓";position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:#6EA51E;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.rs{margin-top:20px}
.rs h3{font-size:14.5px;font-weight:800;margin:0}
.rs h3 span{font-size:12.5px;color:var(--sub);font-weight:600;margin-left:4px}
.chk{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid #F0F1F2;font-size:14px;font-weight:600}
.chk i{width:20px;height:20px;border-radius:6px;border:2px solid #CFD2D6;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:transparent;font-weight:800}
.chk.on i{background:#6EA51E;border-color:#6EA51E;color:#fff}
.none{display:block;margin:16px auto 0;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ticket{margin-top:20px;display:flex;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(40,60,10,.12);border:1px solid #E1EBC9}
.ticket .l{flex:1;padding:18px;background:var(--lime-soft);position:relative}
.ticket .l small{font-size:12px;font-weight:800;color:var(--lime-ink)}
.ticket .l b{display:block;font-size:34px;font-weight:800;letter-spacing:-0.03em;margin-top:2px}
.ticket .l span{font-size:13px;font-weight:600;color:var(--sub)}
.ticket .r{width:92px;background:var(--tp);display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed rgba(255,255,255,.8);font-weight:800}
.ticket .r small{font-size:11px;font-weight:700;color:var(--lime-ink)}
.ticket .r b{font-size:22px}
.anon{font-size:12.5px;color:var(--sub);margin-top:12px}
.xsell{display:flex;align-items:center;gap:12px;width:100%;margin-top:18px;border:1px solid #E8E9EB;border-radius:14px;padding:12px 14px}
.xsell b{display:block;font-size:14px;font-weight:800}.xsell span{font-size:12px;color:var(--sub);font-weight:600}
.xsell .go{margin-left:auto;font-size:18px;color:#999}

/* overlays */
.push{position:absolute;left:10px;right:10px;top:10px;z-index:20;display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.18);text-align:left;width:calc(100% - 20px);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.push.show{transform:translateY(0)}
.push .ico{width:42px;height:42px;border-radius:11px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.push .a{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.push .a span{font-weight:500;color:var(--sub)}
.push .b{font-size:13.5px;font-weight:500;margin-top:2px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(20,21,24,.9);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;width:max-content;max-width:86%;text-align:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1}
</style>
<style>
html,body{height:100%;overscroll-behavior:none}
button,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none}
button:active{opacity:.85}
.btn:active,.opt:active,.pk button:active,.tpban:active{transform:scale(.985)}
.anim .body,.anim .bar{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
.anim.back .body,.anim.back .bar{animation:slideback .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideback{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.anim .body,.anim .bar{animation:none}}
.again{display:block;margin:18px auto 0;font-size:13px;font-weight:700;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
@media (max-width:600px){
  .note,.steps{display:none}
  .wrap{height:100dvh}
  .phone{height:100%}
  .app{padding-top:env(safe-area-inset-top,0px)}
}
</style>
</head>
<body>


<div class="wrap">
  <div class="note"><span><b>Try &amp; Pick</b> 프로토타입</span><button class="restart" id="restart">처음부터</button></div>
  <div class="phone"><div class="app" id="app"></div></div>
  <div class="steps" id="steps"></div>

  <dl class="rows"><div class="row"><dt>결제혜택</dt><dd>카드 즉시할인 최대 <b>3,000원</b></dd><i>›</i></div><div class="row"><dt>적립</dt><dd>포인트 최대 <b>1%</b> 적립 예상</dd><i>›</i></div><div class="row"><dt>일반배송</dt><dd>2,500원 (20,000원 이상 무료배송)<br>평균 3일 이내 도착</dd><i>›</i></div><div class="row"><dt>오늘드림</dt><dd><b>지금 주문하면 오늘 도착 또는 매장 픽업</b></dd><i>›</i></div></dl>

  return sb+hdr('트라이앤픽','detail')+`<div class="body"><div class="hero"><div class="eyb">Try &amp; Pick · 이번 주 열린 고민</div><h1 class="h1">어떤 변화를 원하세요?</h1><p class="lead" style="margin-bottom:0">고르신 고민에 맞춰 두 제품을 골라드려요</p></div>

function card(p,k){return `<div class="pc"><div class="im"><img src="${p.img}" alt="${p.name}"></div><div class="bn">${p.brand}</div><div class="nm">${p.name}</div><div class="pr">${won(p.price)}</div><div class="rt">★ ${p.rate} (${p.rev})</div><label for="shade${k}">호수</label><select id="shade${k}" data-shade="${k}">${SHADES.map(s=>`<option ${S['shade'+k]===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function compare(){
  return sb+hdr('트라이앤픽','concern')+`<div class="body"><div class="pad"><div class="eyb">2주차 고민</div><h1 class="h1">오후에 들뜨는 쿠션<br>둘 중 뭐가 맞을까?</h1><p class="lead">제형도 가격대도 다른 두 후보예요</p>
  <div class="pair">${card(P.A,'A')}${card(P.B,'B')}</div>
  <table class="cmp"><tr><th>용량</th><td>${P.A.vol}</td><td>${P.B.vol}</td></tr><tr><th>1g당</th><td>${P.A.per}</td><td>${P.B.per}</td></tr><tr><th>마무리</th><td>${P.A.finish}</td><td>${P.B.finish}</td></tr><tr><th>이런 분께</th><td>${P.A.fit}</td><td>${P.B.fit}</td></tr></table>
  <div class="tip"><b>써보며 확인할 것</b>아침에 바르고 오후 3시에 들뜸 보기</div></div></div>
  <div class="bar"><button class="btn dark" data-go="apply">샘플 2종 무료로 받기</button></div>`;
}
function apply(){
  return sb+hdr('받는 방법','compare')+`<div class="body"><div class="pad"><h1 class="h1" style="margin-top:0">어떻게 받을까요?</h1>
  <div class="sel" role="radiogroup" aria-label="받는 방법"><button class="opt ${S.method==='ship'?'on':''}" data-method="ship" role="radio" aria-checked="${S.method==='ship'}"><span class="rd"></span><span class="ot"><b>주문할 때 함께 받기</b><span>오늘 주문하는 상품에 같이 넣어 보내드려요</span></span></button>
  <button class="opt ${S.method==='store'?'on':''}" data-method="store" role="radio" aria-checked="${S.method==='store'}"><span class="rd"></span><span class="ot"><b>매장에서 받기</b><span>오늘드림 픽업 선반에서 바로 받아요</span></span></button></div>
  ${S.method==='store'?`<div class="stores" role="radiogroup" aria-label="매장 선택">${STORES.map(s=>`<button class="opt ${S.store===s.id?'on':''}" data-store="${s.id}" role="radio" aria-checked="${S.store===s.id}" style="padding:11px 12px"><span class="rd" style="width:18px;height:18px"></span><span class="ot"><b style="font-size:14px">${s.n}</b><span>${s.s}</span></span></button>`).join('')}<p style="font-size:11.5px;color:var(--mute);margin:2px 0 0">매장 이름과 위치는 예시예요</p></div>`:''}
  <dl class="sum"><dt>받는 샘플</dt><dd>${P.A.name} ${S.shadeA} · ${P.B.name} ${S.shadeB} · 1회용 퍼프 2개</dd><dt>쿠폰</dt><dd>써보고 고른 제품 본품 15% · 수령일부터 14일</dd></dl>
  <ul class="fine"><li>같은 고민은 1인 1회 받을 수 있어요</li><li>후기는 쓰지 않아도 혜택을 드려요</li></ul></div></div>
  <div class="bar"><button class="btn dark" data-go="done">신청하기</button></div>`;
}
function done(){
  const st=STORES.find(s=>s.id===S.store);
  return sb+hdr('신청 완료','')+`<div class="body"><div class="pad done"><div class="ok">${ic.check}</div><h1 class="h1">신청이 완료됐어요</h1><p class="lead">${S.method==='ship'?'주문 상품과 함께 보내드려요':`${st.n}에서 받아가세요`}</p>
  ${S.method==='store'?`<div class="qrc"><canvas id="qr" width="25" height="25" aria-label="수령 QR 예시"></canvas><div><small>수령 번호</small><b>TP-0213</b><p>셀프 계산대에서 QR을 찍으면 픽업 선반 위치를 알려드려요</p></div></div>`:`<div class="qrc"><img src="${IMG.KIT}" alt="" style="width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none"><div><small>도착 예정</small><b>11/12(목)</b><p>쿠션 파우치 2종과 1회용 퍼프가 함께 가요</p></div></div>`}
  <ol class="tl"><li class="on"><i></i><div><b>받기</b><br><span>${S.method==='ship'?'주문 상품과 함께 도착':'매장 픽업 선반에서 수령'}</span></div><span>오늘</span></li><li><i></i><div><b>써보기</b><br><span>손등에 나란히, 오후에 한 번 더</span></div><span>3일</span></li><li><i></i><div><b>고르기</b><br><span>알림이 오면 더 맞은 쪽 한 번 탭</span></div><span>알림</span></li><li><i></i><div><b>쿠폰</b><br><span>고른 제품 본품 15%</span></div><span>14일</span></li></ol>
  <button class="skip" id="skip">3일 뒤로 넘겨보기 (프로토타입)</button></div></div>
  <div class="bar"><button class="btn line" data-go="detail">상품으로 돌아가기</button></div>`;
}
function pick(){
  const R=['오후에도 덜 들떠요','피부 표현이 자연스러워요','커버가 더 잘 돼요','바르는 느낌이 좋아요'];
  return sb+hdr('트라이앤픽','done')+`<div class="body"><div class="pad"><div class="eyb">3일 써보셨네요</div><h1 class="h1">어떤 쿠션이 더 잘 맞았나요?</h1><p class="lead">오후까지 써본 느낌으로 골라주세요</p>
  <div class="pk" role="radiogroup" aria-label="더 맞은 제품">${['A','B'].map(k=>`<button class="${S.pick===k?'on':''}" data-pick="${k}" role="radio" aria-checked="${S.pick===k}"><div class="im"><img src="${P[k].img}" alt=""></div><b>${k} ${P[k].name}</b><span>${S['shade'+k]} · ${P[k].finish}</span></button>`).join('')}</div>
  <div class="rs"><h3>어떤 점이 좋았나요?<span>선택</span></h3>${R.map((r,i)=>`<button class="chk ${S.reasons.includes(i)?'on':''}" data-reason="${i}" role="checkbox" aria-checked="${S.reasons.includes(i)}"><i>✓</i>${r}</button>`).join('')}</div>
  <button class="none" data-go="none">둘 다 잘 맞지 않았어요</button></div></div>
  <div class="bar"><button class="btn dark" data-go="coupon" ${S.pick?'':'disabled'}>이 제품으로 고르기</button></div>`;
}
function coupon(){
  const p=P[S.pick];
  return sb+hdr('트라이앤픽','')+`<div class="body"><div class="pad"><div class="eyb">고르기 완료</div><h1 class="h1">${p.name}을 고르셨어요</h1><p class="lead">고른 제품 본품에 쓸 수 있는 쿠폰이 열렸어요</p>
  <div class="ticket"><div class="l"><small>Try &amp; Pick 쿠폰</small><b>15%</b><span>${p.brand} ${p.name} 본품 · ${S['shade'+p.key]}</span></div><div class="r"><small>남은 기간</small><b>D-14</b></div></div>
  <p class="anon">고른 이유는 이름 없이 브랜드에 전달돼 제품을 고치는 데 쓰여요</p>
  <button class="xsell" data-toast="다음 단계 아이디어: 고른 쿠션과 잘 맞는 기초를 브랜드 상관없이 추천"><div><b>이 쿠션과 잘 맞는 기초 보기</b><span>함께 산 고객이 많은 보습제</span></div><span class="go">›</span></button><button class="again" data-restart="1">처음부터 다시 보기</button></div></div>
  <div class="bar"><button class="btn dark" id="toProduct">본품 보러가기</button></div>`;
}
function none(){
  return sb+hdr('트라이앤픽','pick')+`<div class="body"><div class="pad done"><div class="ok" style="background:#EEF0EA">${ic.check}</div><h1 class="h1">알려주셔서 고마워요</h1><p class="lead">다음 주에는 다른 고민의 두 제품을 준비할게요<br>안 맞은 이유는 브랜드에 전달돼요</p><button class="again" data-restart="1">처음부터 다시 보기</button></div></div>
  <div class="bar"><button class="btn dark" data-go="detail">상품으로 돌아가기</button></div>`;
}
const VIEWS={detail,concern,compare,apply,done,pick,coupon,none};
function drawQR(){const c=document.getElementById('qr');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,25,25);let s=213;const r=()=>(s=(s*9301+49297)%233280)/233280;x.fillStyle='#131518';for(let i=0;i<25;i++)for(let j=0;j<25;j++)if(r()>.52)x.fillRect(i,j,1,1);[[0,0],[18,0],[0,18]].forEach(([a,b])=>{x.fillStyle='#fff';x.fillRect(a,b,7,7);x.fillStyle='#131518';x.fillRect(a,b,7,7);x.fillStyle='#fff';x.fillRect(a+1,b+1,5,5);x.fillStyle='#131518';x.fillRect(a+2,b+2,3,3)})}
let prevIdx=0;const ORDER=['detail','concern','compare','apply','done','pick','coupon','none'];
function render(){
  const ni=ORDER.indexOf(S.screen);app.classList.remove('anim','back');void app.offsetWidth;app.classList.add('anim');if(ni<prevIdx)app.classList.add('back');prevIdx=ni;
  app.innerHTML=VIEWS[S.screen]()+'<div class="scrim" id="scrim"></div><button class="push" id="push" aria-label="알림 열기"><span class="ico"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 8h12l-1 11H6z" fill="none" stroke="#C6E05A" stroke-width="2" stroke-linejoin="round"/><path d="M8 8a3 3 0 016 0" fill="none" stroke="#C6E05A" stroke-width="2"/></svg></span><span style="flex:1;min-width:0"><span class="a">트라이앤픽<span>지금</span></span><span class="b" style="display:block">써보신 두 쿠션, 어느 쪽이 더 잘 맞았나요?</span></span></button><div class="toast" id="toast" role="status"></div>';
  const b=app.querySelector('.body'); if(b) b.scrollTop=0;
  drawQR();
  const idx=STEPS.findIndex(s=>s[0]===S.screen);
  document.getElementById('steps').innerHTML=STEPS.map((s,i)=>`<span class="${i===idx?'on':''}">${s[1]}</span>`).join('<i>›</i>');
  try{localStorage.setItem('tp-proto',JSON.stringify(S))}catch(e){}
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
app.addEventListener('click',e=>{
  const el=e.target.closest('button');if(!el||el.disabled)return;
  const d=el.dataset;
  if(d.restart){S=init();render();return}
  if(el.id==='skip'){const sc=document.getElementById('scrim'),pu=document.getElementById('push');sc.classList.add('show');pu.classList.add('show');return}
  if(el.id==='push'){S.screen='pick';render();return}
  if(el.id==='toProduct'){S.coupon={key:S.pick};S.product=S.pick;S.screen='detail';render();return}
  if(d.toast){toast(d.toast);return}
  if(d.go==='x-back'){toast('프로토타입은 이 상품에서 시작해요');return}
  if(d.concern){S.concern=d.concern;render();return}
  if(d.method){S.method=d.method;render();return}
  if(d.store){S.store=d.store;render();return}
  if(d.pick){S.pick=d.pick;render();return}
  if(d.reason!==undefined){const i=+d.reason,k=S.reasons.indexOf(i);k<0?S.reasons.push(i):S.reasons.splice(k,1);render();return}
  if(d.go){S.screen=d.go;render();}
});
app.addEventListener('change',e=>{const s=e.target.closest('select[data-shade]');if(s){S['shade'+s.dataset.shade]=s.value}});
document.getElementById('restart').onclick=()=>{S=init();render()};
render();
</script>
